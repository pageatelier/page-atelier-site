<!doctype html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PAGE ATELIER에 브랜드 웹사이트 제작을 문의하세요.">
  <meta name="theme-color" content="#f3f0e9">
  <title>문의하기 — PAGE ATELIER</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="contact.css">
  <script src="common.js" defer></script>
  <script src="contact.js" defer></script>
</head>
<body class="min-w-[320px] bg-ivory font-sans text-base leading-[1.65] tracking-[-0.018em] text-ink selection:bg-blue selection:text-paper [&.menu-open]:overflow-hidden [background:radial-gradient(circle_at_8%_7%,rgba(191,212,221,0.5),transparent_26rem),radial-gradient(circle_at_92%_18%,rgba(255,255,255,0.72),transparent_28rem),#f3f0e9]">
<!--@include skip-link-->
<!--@include header-->
<!--@include mobile-menu-->

  <div class="page-enter overflow-x-hidden">
  <main id="main">

    <section class="py-section" id="inquiry">
      <div class="mx-auto grid w-[min(100%,1680px)] grid-cols-[minmax(300px,0.75fr)_minmax(0,1.25fr)] items-start gap-[clamp(50px,10vw,160px)] px-gutter max-[980px]:grid-cols-1">
        <aside class="reveal sticky top-[130px] max-[980px]:static">
          <h2 class="mb-6 mt-5 font-serif text-[clamp(2.6rem,5vw,5.7rem)] font-normal leading-[0.98] tracking-[-0.055em]">Tell us about<br>your brand.</h2>
          <p class="m-0 max-w-[430px] text-ink-soft">브랜드명, 필요한 페이지, 희망 일정과 참고 사이트가 있다면 함께 남겨주세요. 아직 정리되지 않은 단계라도 현재 상황에 맞춰 범위를 제안합니다.</p>
          <div class="mt-[42px] grid gap-[10px]"><a class="w-fit border-b border-line pb-1 text-sm font-semibold" href="mailto:hello@pageatelier.com">hello@pageatelier.com</a><a class="w-fit border-b border-line pb-1 text-sm font-semibold" href="https://www.instagram.com/pageatelier.kr/">인스타그램 · @pageatelier.kr</a><a class="w-fit border-b border-line pb-1 text-sm font-semibold" href="services.html">서비스 안내</a></div>
        </aside>

        <form class="glass-panel-strong reveal grid gap-[30px] rounded-lg border border-white/[0.68] p-[clamp(30px,5vw,62px)] shadow-panel-soft max-[680px]:px-5 max-[680px]:py-7" data-delay="1" data-contact-form data-contact-email="hello@pageatelier.com" novalidate>
          <div class="grid grid-cols-2 gap-[22px] max-[680px]:grid-cols-1">
            <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="name">담당자님 성함 *</label><input class="h-[54px] w-full rounded-none border-0 border-b border-line bg-transparent text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="name" name="name" type="text" autocomplete="name" placeholder="성함" required></div>
            <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="email">이메일 *</label><input class="h-[54px] w-full rounded-none border-0 border-b border-line bg-transparent text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
          </div>
          <div class="grid grid-cols-2 gap-[22px] max-[680px]:grid-cols-1">
            <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="brand">브랜드 / 회사명</label><input class="h-[54px] w-full rounded-none border-0 border-b border-line bg-transparent text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="brand" name="brand" type="text" placeholder="브랜드 또는 회사명"></div>
            <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="project">프로젝트 유형 *</label><select class="h-[54px] w-full rounded-none border-0 border-b border-line bg-transparent text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="project" name="project" required>
              <option>원페이지 웹사이트</option>
              <option>3페이지 웹사이트</option>
              <option>5페이지 이상 웹사이트</option>
              <option>기존 홈페이지 리뉴얼</option>
              <option>아직 구성을 고민 중이에요</option></select></div>
          </div>
          <div class="grid grid-cols-2 gap-[22px] max-[680px]:grid-cols-1">
            <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="budget">예산</label><select class="h-[54px] w-full rounded-none border-0 border-b border-line bg-transparent text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="budget" name="budget">
              <option value="">예산 범위 선택</option>
              <option>100만 원 미만</option>
              <option>100–150만 원</option>
              <option>150–250만 원</option>
              <option>250만 원 이상</option>
              <option>상담 후 결정</option></select>
            </div>

            <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="schedule">희망 일정</label><input class="h-[54px] w-full rounded-none border-0 border-b border-line bg-transparent text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="schedule" name="schedule" type="text" placeholder="예: 9월 중 오픈"></div>
          </div>
          <div class="relative"><label class="mb-[10px] block text-2xs font-semibold uppercase tracking-[0.11em] text-ink-soft" for="message">프로젝트 내용 *</label><textarea class="min-h-[150px] w-full resize-y rounded-none border-0 border-b border-line bg-transparent px-0 py-[14px] text-ink outline-0 transition-colors duration-[250ms] ease-in-out focus:border-blue" id="message" name="message" placeholder="필요한 페이지, 브랜드 소개, 참고 사이트, 현재 준비된 자료 등을 자유롭게 적어주세요." required></textarea></div>
          <p class="-mt-3 min-h-6 text-sm text-blue" data-form-status aria-live="polite"></p>
          <div class="mt-2 flex items-center justify-between gap-6 max-[680px]:flex-col max-[680px]:items-stretch"><p class="m-0 max-w-[380px] text-2xs text-ink-soft">문의 내용은 상담 목적으로만 확인하며, 영업일 기준 24시간 이내 회신드립니다.</p><button class="group inline-flex min-h-12 items-center justify-center gap-3 rounded-full border border-ink bg-ink px-6 text-xs font-semibold text-paper shadow-btn transition-all duration-[350ms] ease-[cubic-bezier(0.2,0.75,0.25,1)] hover:-translate-y-0.5 hover:border-blue hover:bg-blue hover:shadow-btn-hover" type="submit">프로젝트 문의 보내기<svg class="h-3.5 w-3.5 transition-transform duration-[350ms] ease-out group-hover:translate-x-[3px] group-hover:-translate-y-[2px]" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13 13 3M6 3h7v7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
        </form>
      </div>
    </section>

  </main>

<!--@include footer-->
  </div>

<!--@include kakao-float-->
</body>
</html>
